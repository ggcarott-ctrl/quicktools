<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kontak - QuickTools</title>
  <meta name="description" content="Hubungi kami untuk pertanyaan, saran, atau kerja sama.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://quicktools.id/contact.html">
  <link rel="stylesheet" href="css/style.css">
  <script>initTheme();</script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-brand">QuickTools <span>FREE</span></a>
      <div class="nav-links">
        <a href="/">Tools</a>
        <a href="about.html">About</a>
        <a href="blog/index.html">Blog</a>
        <a href="contact.html" class="active">Kontak</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
      <button class="nav-menu-btn">☰</button>
    </div>
  </nav>

  <div class="page-content">
    <h1>Hubungi Kami</h1>

    <p>Punya pertanyaan, saran, atau ingin kerja sama? Jangan ragu untuk menghubungi kami.</p>

    <div class="tool-section" style="margin-top:1.5rem">
      <h2 style="margin-top:0">Kirim Pesan</h2>
      <form onsubmit="sendContact(event)">
        <div class="form-group">
          <label for="name">Nama</label>
          <input type="text" id="name" placeholder="Nama kamu" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="text" id="email" placeholder="email@contoh.com" required>
        </div>
        <div class="form-group">
          <label for="subject">Subjek</label>
          <input type="text" id="subject" placeholder="Perihal pesan" required>
        </div>
        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" placeholder="Tulis pesan kamu di sini..." required style="min-height:120px"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">📤 Kirim</button>
      </form>
      <div id="contactMsg" style="margin-top:1rem;display:none;padding:.8rem;border-radius:8px;font-size:.9rem"></div>
    </div>

    <div class="tool-section">
      <h2 style="margin-top:0">Cara Lain</h2>
      <ul>
        <li><strong>Email:</strong> quicktools.id@gmail.com</li>
        <li><strong>GitHub:</strong> github.com/quicktools</li>
      </ul>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 QuickTools. Semua tools gratis.</div></footer>

  <script src="js/app.js"></script>
  <script>
    function sendContact(e){
      e.preventDefault();
      const name=document.getElementById('name').value;
      const email=document.getElementById('email').value;
      const subject=document.getElementById('subject').value;
      const message=document.getElementById('message').value;
      const mailto=`mailto:quicktools.id@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent('Nama: '+name+'\nEmail: '+email+'\n\n'+message)}`;
      window.location.href=mailto;
      const msg=document.getElementById('contactMsg');
      msg.style.display='block';
      msg.style.background='rgba(34,197,94,.1)';
      msg.style.color='#22c55e';
      msg.textContent='✅ Email client akan terbuka. Silakan kirim pesan dari sana.';
      e.target.reset();
    }
  </script>
</body>
</html>
