<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>URL Encoder/Decoder Online - QuickTools</title>
  <meta name="description" content="Encode dan decode URL dengan benar. Gratis dan cepat.">
  <meta name="keywords" content="url encoder online, url decoder, percent encoding, encode url">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://flare.duckdns.org/tools/url-encoder.html">
  <meta property="og:title" content="URL Encoder/Decoder Online - QuickTools">
  <link rel="stylesheet" href="../css/style.css">
  <script>initTheme();</script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../" class="nav-brand">QuickTools <span>FREE</span></a>
      <div class="nav-links">
        <a href="../">Tools</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Kontak</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
      <button class="nav-menu-btn">☰</button>
    </div>
  </nav>

  <div class="tool-page">
    <h1>🔗 URL Encoder/Decoder</h1>
    <p class="subtitle">Encode dan decode URL (percent encoding) dengan mudah.</p>

    <div class="tool-section">
      <div class="form-group">
        <label for="input">Input URL:</label>
        <textarea id="input" placeholder="https://example.com/search?q=halo dunia&amp;lang=id" style="min-height:80px"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" onclick="urlEnc('encode')">⬆️ Encode</button>
        <button class="btn btn-primary btn-sm" onclick="urlEnc('decode')">⬇️ Decode</button>
        <button class="btn btn-outline btn-sm" onclick="copyText(document.getElementById('output').textContent,this)">📋 Salin</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('input').value='';document.getElementById('output').textContent=''">🗑️ Hapus</button>
      </div>
    </div>

    <div class="tool-section">
      <div class="output-label">Hasil</div>
      <div class="output-box" id="output"><span style="color:var(--text-muted)">Hasil akan muncul di sini...</span></div>
    </div>
  </div>

  <div class="ad-slot">Iklan</div>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 QuickTools. Semua tools gratis.</div></footer>

  <script src="../js/app.js"></script>
  <script>
    function urlEnc(mode){
      const input=document.getElementById('input').value;
      try{
        if(mode==='encode'){
          document.getElementById('output').textContent=encodeURIComponent(input);
        }else{
          document.getElementById('output').textContent=decodeURIComponent(input);
        }
      }catch(err){
        document.getElementById('output').textContent='❌ Error: '+err.message;
      }
    }
  </script>
</body>
</html>
