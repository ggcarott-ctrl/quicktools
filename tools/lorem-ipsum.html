<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../" class="nav-brand">QuickTools <span>FREE</span></a>
      <div class="nav-links">
        <a href="../">Tools</a>

  <div class="tool-page">
    <h1>📄 Lorem Ipsum Generator</h1>
    <p class="subtitle">Generate placeholder text untuk kebutuhan design dan development.</p>

    <div class="tool-section">
      <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end">
        <div class="form-group" style="flex:1;min-width:100px">
          <label for="count">Jumlah Paragraf</label>
          <input type="number" id="count" value="3" min="1" max="50">
        </div>
        <div class="form-group">
          <button class="btn btn-primary" onclick="genLorem()">📄 Generate</button>
        </div>
      </div>
    </div>

    <div class="tool-section">
      <div class="output-label">Hasil</div>
      <div class="output-box" id="output" style="min-height:120px"><span style="color:var(--text-muted)">Klik Generate untuk membuat Lorem Ipsum...</span></div>
      <div class="btn-row" style="margin-top:1rem">
        <button class="btn btn-outline btn-sm" onclick="copyText(document.getElementById('output').textContent,this)">📋 Salin</button>
      </div>
    </div>

  <div class="ad-slot">Iklan</div>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 QuickTools. Semua tools gratis.</div></footer>

  <script src="../js/app.js"></script>
  <script>
    const LWORDS='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'.split(' ');
    function genWord(){return LWORDS[Math.floor(Math.random()*LWORDS.length)];}
    function genSentence(){let s='';const len=8+Math.floor(Math.random()*12);for(let i=0;i<len;i++){s+=(i===0?genWord().charAt(0).toUpperCase()+genWord().slice(1):genWord())+(i<len-1?' ':maj()+' ');}return s;}
    function maj(){return Math.random()>.9?',':Math.random()>.95?'.':' ';}
    function genParagraph(){let p='';const sents=3+Math.floor(Math.random()*5);for(let i=0;i<sents;i++)p+=genSentence();return p.trim()+'.';}
    function genLorem(){
      const count=+document.getElementById('count').value||3;
      let text='';
      for(let i=0;i<count;i++){text+=(i>0?'\n\n':'')+genParagraph();}
      document.getElementById('output').textContent=text;
    }
  </script>
