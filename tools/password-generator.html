<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="description" content="Buat password kuat dan aman secara acak. Atur panjang dan kompleksitas.">
  <meta name="keywords" content="password generator online, buat password kuat, random password generator, password acak">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://quicktools.duckdns.org/tools/password-generator.html">
  <meta property="og:title" content="Password Generator Online Gratis - QuickTools">
  <link rel="stylesheet" href="../css/style.css">
  <script>initTheme();</script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7484651914308080" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-7484651914308080">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../" class="nav-brand">QuickTools <span>FREE</span></a>
      <div class="nav-links">
        <a href="../">Tools</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Kontak</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
      <button class="nav-menu-btn">☰</button>
    </div>
  </nav>

  <div class="tool-page">
    <h1>🔑 Password Generator</h1>
    <p class="subtitle">Buat password kuat dan aman secara acak dalam hitungan detik.</p>

    <div class="tool-section">
      <div class="form-group">
        <label>Panjang Password: <strong id="lenVal">16</strong></label>
        <input type="range" id="length" min="4" max="64" value="16" oninput="document.getElementById('lenVal').textContent=this.value" style="width:100%;accent-color:var(--primary)">
      </div>

      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="optUpper" checked><span class="toggle-slider"></span></label>
        <span>Huruf Besar (A-Z)</span>
      </div>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="optLower" checked><span class="toggle-slider"></span></label>
        <span>Huruf Kecil (a-z)</span>
      </div>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="optNumbers" checked><span class="toggle-slider"></span></label>
        <span>Angka (0-9)</span>
      </div>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="optSymbols" checked><span class="toggle-slider"></span></label>
        <span>Simbol (!@#$%...)</span>
      </div>

      <div class="btn-row" style="margin-top:1rem">
        <button class="btn btn-primary" onclick="genPass()">🔄 Generate</button>
      </div>
    </div>

    <div class="tool-section">
      <div class="output-label">Password</div>
      <div class="output-box" id="output" style="font-size:1.1rem;text-align:center;letter-spacing:1px;cursor:pointer" onclick="copyText(this.textContent,this)">
        <span style="color:var(--text-muted)">Klik Generate untuk membuat password...</span>
      </div>
      <div id="strength" style="text-align:center;margin-top:.8rem;font-size:.85rem;font-weight:600"></div>
    </div>
  </div>

  <div class="ad-slot">Iklan</div>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 QuickTools. Semua tools gratis.</div></footer>

  <script src="../js/app.js"></script>
  <script>
    function genPass(){
      const len=+document.getElementById('length').value;
      let chars='';
      if(document.getElementById('optUpper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if(document.getElementById('optLower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
      if(document.getElementById('optNumbers').checked)chars+='0123456789';
      if(document.getElementById('optSymbols').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
      if(!chars){chars='abcdefghijklmnopqrstuvwxyz';}
      let pw='';
      const arr=new Uint32Array(len);
      crypto.getRandomValues(arr);
      for(let i=0;i<len;i++)pw+=chars[arr[i]%chars.length];
      document.getElementById('output').textContent=pw;
      const s=document.getElementById('strength');
      let score=0;
      if(len>=8)score++;if(len>=12)score++;if(len>=16)score++;
      if(/[A-Z]/.test(pw))score++;if(/[a-z]/.test(pw))score++;
      if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;
      const labels=['Sangat Lemah','Lemah','Sedang','Kuat','Sangat Kuat','Sangat Kuat','Sangat Kuat','Sangat Kuat'];
      const colors=['#ef4444','#f59e0b','#f59e0b','#22c55e','#22c55e','#059669','#059669','#059669'];
      s.textContent='Kekuatan: '+labels[score];
      s.style.color=colors[score];
    }
  </script>
</body>
</html>
