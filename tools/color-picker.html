<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Color Picker Online - QuickTools</title>
  <meta name="description" content="Pilih warna dan dapatkan kode HEX, RGB, HSL secara instan. Gratis.">
  <meta name="keywords" content="color picker online, warna hex, rgb to hex, color converter, pilih warna">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://flare.duckdns.org/tools/color-picker.html">
  <meta property="og:title" content="Color Picker Online - QuickTools">
  <link rel="stylesheet" href="../css/style.css">
  <script>initTheme();</script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../" class="nav-brand">QuickTools <span>FREE</span></a>
      <div class="nav-links">
        <a href="../">Tools</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Kontak</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
      <button class="nav-menu-btn">☰</button>
    </div>
  </nav>

  <div class="tool-page">
    <h1>🎨 Color Picker</h1>
    <p class="subtitle">Pilih warna dan dapatkan kode HEX, RGB, HSL secara instan.</p>

    <div class="tool-section">
      <div style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start">
        <div>
          <input type="color" id="colorPicker" value="#6366f1" style="width:120px;height:120px;border:none;border-radius:var(--radius);cursor:pointer;background:none" oninput="updateColor(this.value)">
          <p style="margin-top:.5rem;font-size:.85rem;color:var(--text-muted);text-align:center">Klik untuk memilih</p>
        </div>
        <div style="flex:1;min-width:200px">
          <div class="form-group">
            <label>HEX</label>
            <input type="text" id="hex" value="#6366f1" oninput="fromHex(this.value)" style="font-family:var(--mono)">
          </div>
          <div class="form-group">
            <label>RGB</label>
            <input type="text" id="rgb" value="rgb(99, 102, 241)" readonly style="font-family:var(--mono);cursor:pointer" onclick="copyText(this.value,this)">
          </div>
          <div class="form-group">
            <label>HSL</label>
            <input type="text" id="hsl" value="hsl(239, 84%, 67%)" readonly style="font-family:var(--mono);cursor:pointer" onclick="copyText(this.value,this)">
          </div>
        </div>
      </div>
      <div style="margin-top:1.5rem">
        <div class="output-label">Preview Warna</div>
        <div id="preview" style="width:100%;height:80px;border-radius:var(--radius-sm);background:#6366f1;transition:background .2s"></div>
      </div>
    </div>
  </div>

  <div class="ad-slot">Iklan</div>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 QuickTools. Semua tools gratis.</div></footer>

  <script src="../js/app.js"></script>
  <script>
    function hexToRgb(hex){
      const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      return{r,g,b};
    }
    function rgbToHsl(r,g,b){
      r/=255;g/=255;b/=255;
      const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2;
      let h=0,s=0;
      if(max!==min){
        const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
        if(max===r)h=((g-b)/d+(g<b?6:0))/6;
        else if(max===g)h=((b-r)/d+2)/6;
        else h=((r-g)/d+4)/6;
      }
      return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
    }
    function updateColor(hex){
      document.getElementById('hex').value=hex;
      const{r,g,b}=hexToRgb(hex);
      document.getElementById('rgb').value=`rgb(${r}, ${g}, ${b})`;
      const hsl=rgbToHsl(r,g,b);
      document.getElementById('hsl').value=`hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
      document.getElementById('preview').style.background=hex;
    }
    function fromHex(val){
      if(/^#[0-9a-f]{6}$/i.test(val))updateColor(val);
    }
  </script>
</body>
</html>
