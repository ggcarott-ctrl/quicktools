<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word Counter Online Gratis - QuickTools</title>
  <meta name="description" content="Hitung kata, karakter, kalimat, paragraf, dan waktu baca secara real-time. Gratis, cepat, tanpa daftar.">
  <meta name="keywords" content="word counter online, hitung kata online, character counter, hitung karakter">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://quicktools.duckdns.org/tools/word-counter.html">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Word Counter Online Gratis - QuickTools">
  <meta property="og:description" content="Hitung kata, karakter, kalimat, paragraf, dan waktu baca secara real-time.">
  <link rel="stylesheet" href="../css/style.css">
  <script>initTheme();</script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../" class="nav-brand">QuickTools <span>FREE</span></a>
      <div class="nav-links">
        <a href="../">Tools</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Kontak</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
      <button class="nav-menu-btn">☰</button>
    </div>
  </nav>

  <div class="tool-page">
    <h1>📝 Word Counter</h1>
    <p class="subtitle">Hitung kata, karakter, kalimat, paragraf, dan waktu baca secara real-time.</p>

    <div class="tool-section">
      <div class="form-group">
        <label for="input">Masukkan atau tempel teks di sini:</label>
        <textarea id="input" placeholder="Ketik atau paste teks di sini..." oninput="count()"></textarea>
      </div>

      <div class="stats-bar" id="stats">
        <div>Kata: <strong id="words">0</strong></div>
        <div>Karakter: <strong id="chars">0</strong></div>
        <div>Karakter (spasi): <strong id="charsSpace">0</strong></div>
        <div>Kalimat: <strong id="sentences">0</strong></div>
        <div>Paragraf: <strong id="paragraphs">0</strong></div>
        <div>Waktu baca: <strong id="readTime">0</strong> menit</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-outline btn-sm" onclick="clearInput()">🗑️ Hapus</button>
        <button class="btn btn-outline btn-sm" onclick="copyText(document.getElementById('input').value,this)">📋 Salin</button>
      </div>
    </div>
  </div>

  <div class="ad-slot">Iklan</div>

  <footer class="footer">
    <div class="footer-bottom">&copy; 2026 QuickTools. Semua tools gratis.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    function count(){
      const t=document.getElementById('input').value;
      const trim=t.trim();
      document.getElementById('words').textContent=trim?trim.split(/\s+/).length:0;
      document.getElementById('chars').textContent=t.length;
      document.getElementById('charsSpace').textContent=t.replace(/\s/g,'').length;
      document.getElementById('sentences').textContent=trim?trim.split(/[.!?]+/).filter(s=>s.trim()).length:0;
      document.getElementById('paragraphs').textContent=trim?trim.split(/\n\s*\n/).filter(s=>s.trim()).length:(t.trim()?1:0);
      const wc=trim?trim.split(/\s+/).length:0;
      document.getElementById('readTime').textContent=Math.max(1,Math.ceil(wc/200));
    }
    function clearInput(){document.getElementById('input').value='';count();}
  </script>
</body>
</html>
